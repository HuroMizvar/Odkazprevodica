name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk odkaz-pre-vodica-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: odkaz-pre-vodica-debug
          path: odkaz-pre-vodica-debug.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Testovacia verzia ${{ github.run_number }}
          prerelease: true
          files: odkaz-pre-vodica-debug.apk
