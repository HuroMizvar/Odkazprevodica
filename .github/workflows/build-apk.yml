name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Rozbaliť nahraný ZIP
        run: |
          shopt -s nullglob
          zips=(Odkazprevodica*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              echo "Rozbaľujem $z"
              rm -rf /tmp/unz && mkdir /tmp/unz && unzip -q -o "$z" -d /tmp/unz
              src=/tmp/unz/Odkazprevodica
              [ -d "$src" ] || src=/tmp/unz
              rm -rf "$src/.git" "$src/.github"
              cp -a "$src"/. ./
              git rm -q "$z"
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Rozbalený nahraný ZIP" || true
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk odkaz-pre-vodica-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: odkaz-pre-vodica-debug
          path: odkaz-pre-vodica-debug.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Testovacia verzia ${{ github.run_number }}
          prerelease: true
          files: odkaz-pre-vodica-debug.apk

      - name: Build Google Play AAB
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab odkaz-pre-vodica-play-${{ github.run_number }}.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        with:
          name: google-play-aab-${{ github.run_number }}
          path: odkaz-pre-vodica-play-*.aab
